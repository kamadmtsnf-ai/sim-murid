name: Rebuilt verification
on:
  pull_request:
    branches: [main]
    paths: ['rebuilt/**', '.github/workflows/rebuilt-checks.yml']
  push:
    branches: [main]
    paths: ['rebuilt/**', '.github/workflows/rebuilt-checks.yml']
permissions:
  contents: read
concurrency:
  group: rebuilt-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Rebuilt check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rebuilt
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
